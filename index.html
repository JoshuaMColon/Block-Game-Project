<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Mini Game</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: cneter; height: 100vh; overflow: hidden; color: white; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id ="ui" style = "position: absolute; top: 20px; text-align: center;">
        <h1> Score: <span id = "score" >0</span></h1>
        <p> Move your mouse to dodge the red blocks! </p>
    </div>
    <canvas id ="gameCanvas"></canvas>
<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score")

    canvas.width = 400;
    canvas.height = 500;

    let score = 0;
    let gameActive = true;

    //Player Object
    const player = { x: 200, y: 450, size: 20, color: "#00ffcc"};

    //Enemy Array
    const enemies = [];

    //Track Mouse
    window.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        player.x = e.clientX - rect.left - player.size / 2;
    });

    function spawnEnemy() {
        if(!gameActive) return;
        const size = Math.random() * 30 + 10;
        enemies.push ({
            x: Math.random() * (canvas.width - size),
            y: -size,
            size: size,
            speed: Math.random() * 3 + 2
        });
        setTimeout(spawnEnemy, 600); //Spawn every 0.6 seconds
    }

    function update() {
        if(!gameActive) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        //Draw Player
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.size, player.size);

        //Update & Draw Enemies
        for(let i = enemies.length - 1; i >= 0, i--;) {
            let e = enemies[i];
            e.y += e.speed;

            ctx.fillStyle = "#ff4444";
            ctx.fillRect(e.x, e.y, e.size, e.size);

            //Collision Detection
            if(player.x < e.x + e.size && player.x + player.size > e.x &&
                player.y < e.y + e.size && player.y + player.size > e.y) {
                gameActive = false;
                alert("Game Over! Score: " + score);
                location.reload(); //Restart
            }

            //Remove off-screen enemies and score points
            if(e.y > canvas.height) {
                enemies.splice(i, 1);
                score++;
                scoreElement.innerText = score;
            }
        }
        requestAnimationFrame(update);
    }

    spawnEnemy();
    update();

/* How the logic works:
1. The Canvas Context (ctx): Think of this as the "paintbrush" that draws the rectangles.

2. requestAnimationFrame: This is a high-performance loop that tells the browser, "Run this function as fast as you can draw a frame" (usually 60 times per second).

3. Collision Logic: We use a basic "AABB" (Axis-Aligned Bounding Box) check. It basically asks: Is the player's left side to the left of the enemy's right side? (and so on for all four sides). */

</script>
</body>
</html>
